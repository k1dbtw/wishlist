<title>Мой вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column — capture bar on top, a single list sheet of wishes, each carrying a yellow shop price tag */
:root {
  --bg: #eceef2;
  --surface: #ffffff;
  --ink: #15171c;
  --muted: #5f6570;
  --line: #dadde3;
  --tag: #ffd43b;
  --tag-ink: #1d1700;
  --ok: #1b8f4d;
  --danger: #c93434;
  --focus: #2f5bff;
  --shadow: 0 1px 2px rgb(20 24 32 / .06), 0 8px 24px rgb(20 24 32 / .06);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --surface: #171a20; --ink: #eceef2; --muted: #9aa1ad; --line: #292e37;
    --tag: #ffd43b; --tag-ink: #1d1700; --ok: #3ccb7f; --danger: #ff6b6b; --focus: #7d98ff;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #171a20; --ink: #eceef2; --muted: #9aa1ad; --line: #292e37;
  --tag: #ffd43b; --tag-ink: #1d1700; --ok: #3ccb7f; --danger: #ff6b6b; --focus: #7d98ff;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  padding-inline: 16px; padding-block: 20px 96px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
header { display: grid; gap: 6px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 clamp(26px, 7vw, 34px)/1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1 span { background: var(--tag); color: var(--tag-ink); padding: 0 .18em; border-radius: 6px; }
.summary { color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 600; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; background: var(--surface); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"] i { background: var(--ok); }
.sync[data-s="busy"] i { background: var(--tag); animation: pulse 1s infinite alternate; }
.sync[data-s="local"] i, .sync[data-s="err"] i { background: var(--danger); }
@keyframes pulse { to { opacity: .35; } }

/* composer */
.composer { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: grid; gap: 10px; }
.composer input#q { width: 100%; border: 0; background: transparent; font-size: 17px; padding: 8px 6px; outline: none; }
.composer input#q::placeholder { color: var(--muted); }
.crow { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.parse { font-size: 13px; color: var(--muted); padding-inline: 6px; min-height: 1.3em; overflow-wrap: anywhere; }
.parse b { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.add { border: 0; background: var(--tag); color: var(--tag-ink); font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; }
.add:disabled { opacity: .45; cursor: default; }

/* priority bars */
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.bars i { width: 3px; border-radius: 1px; background: currentColor; opacity: .25; }
.bars i:nth-child(1) { height: 5px; } .bars i:nth-child(2) { height: 8px; } .bars i:nth-child(3) { height: 12px; }
.bars[data-p="1"] i:nth-child(-n+1), .bars[data-p="2"] i:nth-child(-n+2), .bars[data-p="3"] i { opacity: 1; }

/* toolbar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs { display: inline-flex; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 99px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs small { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }
select#sort { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; }

/* list */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.list:empty { display: none; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 14px 14px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.item:first-child { border-top: 0; }
.item:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.chk { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.chk:hover { border-color: var(--ok); }
.chk svg { width: 14px; height: 14px; opacity: 0; stroke: var(--surface); }
.item.done .chk { background: var(--ok); border-color: var(--ok); }
.item.done .chk svg { opacity: 1; }
.body { min-width: 0; display: grid; gap: 3px; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.item.done .title { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meta a { color: var(--muted); text-underline-offset: 2px; overflow-wrap: anywhere; }
.meta a:hover { color: var(--ink); }
.note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }

/* the price tag */
.tag { position: relative; background: var(--tag); color: var(--tag-ink); font: 600 14px/1 var(--f-body); font-variant-numeric: tabular-nums; padding: 8px 10px 8px 20px; white-space: nowrap;
  clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); border-radius: 0 6px 6px 0; }
.tag::before { content: ""; position: absolute; left: 9px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--surface); }
.tag.none { background: var(--line); color: var(--muted); font-weight: 500; }
.item.done .tag { filter: grayscale(1); opacity: .6; }

.empty { text-align: center; color: var(--muted); padding: 36px 16px; background: var(--surface); border-radius: var(--r); border: 1px dashed var(--line); }
.empty strong { display: block; color: var(--ink); font: 500 16px/1.3 var(--f-display); margin-bottom: 6px; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
.hint { font-size: 12px; color: var(--muted); text-align: center; }
kbd { font: 12px/1 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

/* edit sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; align-items: end; justify-items: center; z-index: 10; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 92%; overflow: auto; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h2 { font: 500 18px/1.2 var(--f-display); margin: 0; }
.sheet label, .sheet .field { display: grid; gap: 4px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.sheet input, .sheet textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); font-size: 16px; text-transform: none; letter-spacing: 0; width: 100%; }
.sheet textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; padding-top: 4px; }
.ghost { border: 1px solid var(--line); background: transparent; padding: 10px 16px; border-radius: 10px; cursor: pointer; }
.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 12px 10px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast button { border: 0; background: var(--tag); color: var(--tag-ink); font-weight: 600; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>Хочу <span>вот это</span></h1>
      <div class="sync" id="sync" data-s="busy"><i></i><span id="syncText">подключаюсь</span></div>
    </div>
    <div class="summary" id="summary">Загружаю список…</div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <input id="q" type="text" enterkeyhint="done" placeholder="Чего хочется? Можно со ссылкой и ценой" aria-label="Новое желание">
    <div class="parse" id="parse">Пример: <b>Кеды Converse</b> https://… <b>7 990</b> — разберу сам</div>
    <div class="crow">
      <div class="seg" id="prio" role="group" aria-label="Насколько хочется">
        <button type="button" data-p="1" aria-pressed="false"><span class="bars" data-p="1"><i></i><i></i><i></i></span>можно</button>
        <button type="button" data-p="2" aria-pressed="true"><span class="bars" data-p="2"><i></i><i></i><i></i></span>хочу</button>
        <button type="button" data-p="3" aria-pressed="false"><span class="bars" data-p="3"><i></i><i></i><i></i></span>очень</button>
      </div>
      <button class="add" id="addBtn" type="submit" disabled>Добавить</button>
    </div>
  </form>

  <div class="notice" id="notice" hidden></div>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabWant" aria-selected="true" data-tab="want">Хочу<small id="cWant">0</small></button>
      <button role="tab" id="tabDone" aria-selected="false" data-tab="done">Сбылось<small id="cDone">0</small></button>
    </div>
    <select id="sort" aria-label="Сортировка">
      <option value="new">Сначала новые</option>
      <option value="prio">Сначала важные</option>
      <option value="exp">Сначала дорогие</option>
      <option value="cheap">Сначала дешёвые</option>
    </select>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="hint">Нажми на желание, чтобы изменить. <kbd>/</kbd> — быстро добавить.</div>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" autocomplete="off">
    <h2>Желание</h2>
    <label>Название<input id="fTitle" required maxlength="200"></label>
    <label>Ссылка<input id="fUrl" type="url" inputmode="url" placeholder="https://"></label>
    <div class="row2">
      <label>Цена, ₽<input id="fPrice" inputmode="decimal" placeholder="0"></label>
      <div class="field"><span>Насколько хочется</span>
        <div class="seg" id="fPrio" role="group" aria-label="Насколько хочется">
          <button type="button" data-p="1" aria-pressed="false"><span class="bars" data-p="1"><i></i><i></i><i></i></span></button>
          <button type="button" data-p="2" aria-pressed="false"><span class="bars" data-p="2"><i></i><i></i><i></i></span></button>
          <button type="button" data-p="3" aria-pressed="false"><span class="bars" data-p="3"><i></i><i></i><i></i></span></button>
        </div>
      </div>
    </div>
    <label>Заметка<textarea id="fNote" maxlength="1000" placeholder="Размер, цвет, где видел…"></textarea></label>
    <div class="actions">
      <button type="button" class="ghost danger" id="fDel">Удалить</button>
      <div style="display:flex;gap:10px">
        <button type="button" class="ghost" id="fCancel">Отмена</button>
        <button type="submit" class="add" id="fSave">Сохранить</button>
      </div>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastBtn" type="button">Вернуть</button></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LS_CACHE = "wishlist.cache.v1", LS_LOCAL = "wishlist.local.v1", LS_UI = "wishlist.ui.v1";
  const PRIO = { 1: "можно", 2: "хочу", 3: "очень" };
  const rub = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });
  const fmt = (n) => rub.format(n) + " ₽";
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const state = { items: {}, tab: "want", sort: "new", prio: 2, canWrite: true, editing: null };
  const ui = lsGet(LS_UI); if (ui) { state.tab = ui.tab || "want"; state.sort = ui.sort || "new"; }
  const saveUi = () => lsSet(LS_UI, { tab: state.tab, sort: state.sort });

  const newId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

  // ---------- parsing the quick-add line ----------
  function parseLine(raw) {
    let s = raw.trim(), url = "", price = null;
    const m = s.match(/https?:\/\/\S+/i);
    if (m) { url = m[0].replace(/[),.]+$/, ""); s = (s.slice(0, m.index) + " " + s.slice(m.index + m[0].length)).trim(); }
    const p = s.match(/(?:^|\s)(\d[\d\s]*(?:[.,]\d+)?)\s*(к|k|тыс\.?|₽|р\.?|руб\.?|rub)?\s*$/i);
    if (p) {
      let n = parseFloat(p[1].replace(/\s/g, "").replace(",", "."));
      const suf = (p[2] || "").toLowerCase();
      if (/^(к|k|тыс)/.test(suf)) n *= 1000;
      if (Number.isFinite(n) && (suf || n >= 100)) { price = Math.round(n * 100) / 100; s = s.slice(0, p.index).trim(); }
    }
    s = s.replace(/[\s,—–-]+$/, "").trim();
    if (!s && url) s = host(url);
    return { title: s, url, price };
  }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } }
  function safeUrl(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } }
  function parsePrice(v) { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; }

  // ---------- stores ----------
  let store = null;
  const localStore = {
    kind: "local",
    data: lsGet(LS_LOCAL) || {},
    flush() { lsSet(LS_LOCAL, this.data); state.items = { ...this.data }; render(); },
    async set(id, doc) { this.data[id] = doc; this.flush(); },
    async update(id, patch) { this.data[id] = { ...this.data[id], ...patch }; this.flush(); },
    async remove(id) { delete this.data[id]; this.flush(); },
  };
  function dbStore(db) {
    const col = db.collection("wishes");
    return {
      kind: "db",
      set: (id, doc) => col.doc(id).set(doc),
      update: (id, patch) => col.doc(id).update(patch),
      remove: (id) => col.doc(id).delete(),
    };
  }

  function setSync(s, text) { $("sync").dataset.s = s; $("syncText").textContent = text; }
  function notice(text) { $("notice").textContent = text || ""; $("notice").hidden = !text; }

  async function write(fn) {
    if (!state.canWrite) { toast("Этот список только для просмотра"); return false; }
    try { await fn(); return true; }
    catch (e) {
      if (e && e.code === "invalid_argument" && store.kind === "db") { state.canWrite = false; applyWriteMode(); toast("Нет прав на изменение этого списка"); }
      else if (e && e.code === "quota_exceeded") toast("Список переполнен — удали пару старых желаний");
      else toast("Не сохранилось. Проверь интернет и попробуй ещё раз");
      return false;
    }
  }

  function applyWriteMode() {
    $("composer").hidden = !state.canWrite;
    if (!state.canWrite) notice("Ты смотришь чужой вишлист. Изменять его может только владелец.");
  }

  // ---------- boot ----------
  const cached = lsGet(LS_CACHE);
  if (cached) { state.items = cached; }
  render();

  (async () => {
    const db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db").catch(() => null) : null;
    if (!db) {
      store = localStore;
      state.items = { ...localStore.data };
      setSync("local", "только это устройство");
      notice("Синхронизация здесь недоступна. Открой вишлист по ссылке на claude.ai — тогда телефон и компьютер увидят одно и то же. Пока всё сохраняется только в этом браузере.");
      render();
      return;
    }
    store = dbStore(db);
    try {
      const user = await window.claude.use("user").catch(() => null);
      if (user) { const ok = await user.canEdit(); if (ok === false) { state.canWrite = false; applyWriteMode(); } }
    } catch {}
    const sub = () => db.collection("wishes").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
      state.items = next;
      lsSet(LS_CACHE, next);
      if (snap.metadata.hasPendingWrites) setSync("busy", "сохраняю");
      else if (snap.metadata.fromCache) setSync("busy", "синхронизирую");
      else setSync("ok", "синхронизировано");
      render();
    }, (err) => {
      if (err && err.code === "unavailable") { setSync("busy", "переподключаюсь"); setTimeout(sub, 3000); }
      else { setSync("err", "нет связи"); notice("Связь с хранилищем потеряна. Обнови страницу."); }
    });
    sub();
  })();

  // ---------- render ----------
  function sorted(list) {
    const by = {
      new: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
      prio: (a, b) => (b.priority || 0) - (a.priority || 0) || (b.createdAt || 0) - (a.createdAt || 0),
      exp: (a, b) => (b.price ?? -1) - (a.price ?? -1),
      cheap: (a, b) => (a.price ?? Infinity) - (b.price ?? Infinity),
    }[state.sort];
    if (state.tab === "done" && state.sort === "new") return list.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    return list.sort(by);
  }

  function render() {
    const all = Object.entries(state.items).map(([id, d]) => ({ id, ...d }));
    const want = all.filter((x) => !x.done), done = all.filter((x) => x.done);
    const total = want.reduce((s, x) => s + (x.price || 0), 0);
    const noPrice = want.filter((x) => x.price == null).length;

    $("cWant").textContent = want.length; $("cDone").textContent = done.length;
    const sm = $("summary"); sm.textContent = "";
    if (!all.length) sm.textContent = store ? "Список пуст — самое время что-нибудь захотеть." : "Загружаю список…";
    else {
      sm.append(word(want.length, ["желание", "желания", "желаний"]) + " на ");
      const b = document.createElement("b"); b.textContent = fmt(total); sm.append(b);
      if (noPrice) sm.append(` · без цены: ${noPrice}`);
      if (done.length) sm.append(` · сбылось ${done.length}`);
    }

    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    $("sort").value = state.sort;

    const rows = sorted(state.tab === "want" ? want : done);
    const list = $("list"); list.textContent = "";
    rows.forEach((x) => list.append(row(x)));

    const empty = $("empty");
    empty.hidden = rows.length > 0 || !store;
    if (!rows.length) {
      empty.textContent = "";
      const t = document.createElement("strong");
      t.textContent = state.tab === "want" ? "Пока ничего не хочется?" : "Здесь будут сбывшиеся желания";
      empty.append(t, state.tab === "want"
        ? "Напиши в строке выше, например: «Наушники Sony WH-1000XM5 32к». Цену и ссылку я вытащу сам."
        : "Отметь кружок слева у желания, когда оно исполнится.");
    }
  }

  function row(x) {
    const el = document.createElement("div");
    el.className = "item" + (x.done ? " done" : "");
    el.tabIndex = 0; el.dataset.id = x.id;

    const chk = document.createElement("button");
    chk.type = "button"; chk.className = "chk"; chk.innerHTML = checkSvg;
    chk.setAttribute("aria-label", x.done ? "Вернуть в список" : "Отметить как сбывшееся");
    chk.addEventListener("click", (e) => { e.stopPropagation(); toggleDone(x); });

    const body = document.createElement("div"); body.className = "body";
    const t = document.createElement("div"); t.className = "title"; t.textContent = x.title || "Без названия";
    const meta = document.createElement("div"); meta.className = "meta";
    const bars = document.createElement("span"); bars.className = "bars"; bars.dataset.p = x.priority || 2; bars.innerHTML = "<i></i><i></i><i></i>";
    bars.title = PRIO[x.priority || 2];
    meta.append(bars);
    const u = safeUrl(x.url || "");
    if (u) { const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = host(u) || "ссылка"; a.addEventListener("click", (e) => e.stopPropagation()); meta.append(a); }
    const when = document.createElement("span"); when.textContent = ago(x.done ? x.doneAt : x.createdAt); meta.append(when);
    body.append(t, meta);
    if (x.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = x.note; body.append(n); }

    const tag = document.createElement("div");
    tag.className = "tag" + (x.price == null ? " none" : "");
    tag.textContent = x.price == null ? "цена?" : fmt(x.price);

    el.append(chk, body, tag);
    el.addEventListener("click", () => openEdit(x.id));
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target === el) openEdit(x.id); });
    return el;
  }

  function word(n, f) { const m10 = n % 10, m100 = n % 100; const w = m10 === 1 && m100 !== 11 ? f[0] : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? f[1] : f[2]; return `${n} ${w}`; }
  function ago(ts) {
    if (!ts) return "";
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return "только что";
    if (d < 3600) return Math.floor(d / 60) + " мин назад";
    if (d < 86400) return Math.floor(d / 3600) + " ч назад";
    return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
  }

  // ---------- actions ----------
  const q = $("q");
  function updateParse() {
    const v = q.value.trim(); $("addBtn").disabled = !v;
    const out = $("parse");
    if (!v) { out.innerHTML = "Пример: <b>Кеды Converse</b> https://… <b>7 990</b> — разберу сам"; return; }
    const p = parseLine(v); out.textContent = "";
    const b = document.createElement("b"); b.textContent = p.title || "…"; out.append(b);
    if (p.url) out.append(" · " + host(p.url));
    out.append(" · " + (p.price != null ? fmt(p.price) : "без цены"));
  }
  q.addEventListener("input", updateParse);

  $("prio").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.prio = +b.dataset.p;
    $("prio").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });

  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = q.value.trim(); if (!v || !store) return;
    const p = parseLine(v);
    const doc = { title: p.title.slice(0, 200) || "Без названия", url: p.url, price: p.price, priority: state.prio, note: "", done: false, createdAt: Date.now() };
    q.value = ""; updateParse();
    if (state.tab !== "want") { state.tab = "want"; saveUi(); }
    const ok = await write(() => store.set(newId(), doc));
    if (!ok) { q.value = v; updateParse(); }
  });

  async function toggleDone(x) {
    const done = !x.done;
    await write(() => store.update(x.id, { done, doneAt: done ? Date.now() : null }));
    if (done) toast("Сбылось! Желание в разделе «Сбылось»");
  }

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.tab; saveUi(); render(); }));
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; saveUi(); render(); });

  // ---------- edit sheet ----------
  let sheetPrio = 2;
  function setSheetPrio(p) { sheetPrio = p; $("fPrio").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.p === p))); }
  $("fPrio").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setSheetPrio(+b.dataset.p); });

  function openEdit(id) {
    const x = state.items[id]; if (!x) return;
    state.editing = id;
    $("fTitle").value = x.title || ""; $("fUrl").value = x.url || "";
    $("fPrice").value = x.price == null ? "" : String(x.price).replace(".", ",");
    $("fNote").value = x.note || ""; setSheetPrio(x.priority || 2);
    [$("fTitle"), $("fUrl"), $("fPrice"), $("fNote")].forEach((i) => (i.readOnly = !state.canWrite));
    $("fDel").hidden = $("fSave").hidden = !state.canWrite;
    $("scrim").hidden = false;
  }
  function closeEdit() { $("scrim").hidden = true; state.editing = null; }
  $("fCancel").addEventListener("click", closeEdit);
  $("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) closeEdit(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("scrim").hidden) closeEdit();
    if (e.key === "/" && $("scrim").hidden && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });

  $("sheet").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = state.editing; if (!id) return;
    const rawUrl = $("fUrl").value.trim();
    const patch = {
      title: $("fTitle").value.trim().slice(0, 200) || "Без названия",
      url: rawUrl ? safeUrl(/^https?:\/\//i.test(rawUrl) ? rawUrl : "https://" + rawUrl) : "",
      price: parsePrice($("fPrice").value),
      priority: sheetPrio,
      note: $("fNote").value.trim().slice(0, 1000),
    };
    closeEdit();
    await write(() => store.update(id, patch));
  });

  $("fDel").addEventListener("click", async () => {
    const id = state.editing; if (!id) return;
    const copy = { ...state.items[id] };
    closeEdit();
    if (await write(() => store.remove(id))) toast("Удалено: " + (copy.title || ""), () => write(() => store.set(id, copy)));
  });

  // ---------- toast ----------
  let toastTimer;
  function toast(text, undo) {
    $("toastText").textContent = text;
    const btn = $("toastBtn"); btn.hidden = !undo;
    btn.onclick = undo ? () => { $("toast").hidden = true; undo(); } : null;
    $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").hidden = true), undo ? 6000 : 2800);
  }

  // refresh relative times once a minute
  setInterval(() => { if ($("scrim").hidden) render(); }, 60000);
})();
</script>
