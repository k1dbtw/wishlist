<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stash</title>
<style>
  :root { --bg: #f4f4f6; --fg: #16161a; --muted: #85858f; --line: #e3e3e9; --bad: #d03b3b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f11; --fg: #ececf0; --muted: #74747e; --line: #232328; --bad: #ff6b6b; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; padding: 18vh 24px 40px; }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font: italic 400 64px/0.9 "Iowan Old Style", "Times New Roman", serif; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  form { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  form:focus-within { border-color: var(--fg); }
  input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: inherit; font: inherit; font-size: 19px; padding: 8px 0; }
  button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); font-size: 20px; }
  .err { color: var(--bad); min-height: 1.5em; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>stash</h1>
  <p>Введи адрес своего сайта stash, например <b>k1d-stash.netlify.app</b>. Это нужно один раз: дальше приложение открывается сразу.</p>
  <form id="f">
    <input id="u" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="адрес сайта" required>
    <button type="submit" aria-label="продолжить">→</button>
  </form>
  <p class="err" id="e"></p>
</main>
<script>
  if (location.hash === "#bad") document.getElementById("e").textContent = "Похоже, в адресе опечатка. Нужен адрес вида что-то.netlify.app";
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = document.getElementById("u").value.trim();
    if (v) location.href = "stash://site?u=" + encodeURIComponent(v);
  });
  document.getElementById("u").focus();
</script>
</body>
</html>
